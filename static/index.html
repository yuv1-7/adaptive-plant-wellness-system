<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Analysis & Care System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 50%, #229954 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1400px;
            width: 100%;
            padding: 40px;
            margin: 0 auto;
        }

        h1 {
            color: #27ae60;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: #f0f0f0;
            border: 2px solid #ddd;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #666;
        }

        .mode-btn:hover {
            background: #e8e8e8;
            border-color: #27ae60;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            border-color: #27ae60;
            font-weight: bold;
        }

        .upload-area {
            border: 3px dashed #27ae60;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8fff8;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #229954;
            background: #f0fff0;
        }

        .upload-area.drag-over {
            border-color: #229954;
            background: #e8ffe8;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 15px;
            color: #27ae60;
        }

        #fileInput {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(46, 204, 113, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #27ae60;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 968px) {
            .results-grid {
                grid-template-columns: 1fr;
            }
        }

        .section-header {
            font-size: 1.5em;
            color: #27ae60;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #27ae60;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-card {
            background: #f8fff8;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #27ae60;
            transition: transform 0.2s;
        }

        .result-card:hover {
            transform: translateX(5px);
        }

        .disease-card {
            background: #fff8f0;
            border-left: 5px solid #f39c12;
        }

        .disease-card.healthy {
            background: #f0fff8;
            border-left: 5px solid #2ecc71;
        }

        .disease-card.warning {
            background: #fff0f0;
            border-left: 5px solid #e74c3c;
        }

        .confidence {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        /* Care Plan Styles */
        .care-plan-section {
            margin-top: 30px;
            grid-column: 1 / -1;
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
        }

        .care-plan-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .care-plan-header h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .care-plan-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
            font-size: 0.95em;
        }

        .care-plan-meta span {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
        }

        .care-plan-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            line-height: 1.8;
            color: #333;
        }

        .care-plan-content h1,
        .care-plan-content h2,
        .care-plan-content h3,
        .care-plan-content h4 {
            color: #27ae60;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .care-plan-content h1 {
            font-size: 2em;
            border-bottom: 3px solid #27ae60;
            padding-bottom: 10px;
        }

        .care-plan-content h2 {
            font-size: 1.6em;
            border-bottom: 2px solid #27ae60;
            padding-bottom: 8px;
        }

        .care-plan-content h3 {
            font-size: 1.3em;
            color: #667eea;
        }

        .care-plan-content h4 {
            font-size: 1.1em;
        }

        .care-plan-content ul,
        .care-plan-content ol {
            margin-left: 25px;
            margin-bottom: 15px;
        }

        .care-plan-content li {
            margin-bottom: 8px;
        }

        .care-plan-content p {
            margin-bottom: 15px;
        }

        .care-plan-content strong {
            color: #27ae60;
            font-weight: 600;
        }

        .care-plan-content em {
            color: #666;
        }

        .care-plan-content blockquote {
            border-left: 4px solid #667eea;
            padding-left: 20px;
            margin: 20px 0;
            color: #666;
            font-style: italic;
        }

        .warning-message,
        .success,
        .error {
            padding: 15px 20px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .warning-message {
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            color: #856404;
        }

        .success {
            background: #e6ffe6;
            border-left: 5px solid #44ff44;
            color: #006600;
        }

        .error {
            background: #ffe6e6;
            border-left: 5px solid #ff4444;
            color: #cc0000;
        }

        .hidden {
            display: none;
        }

        .preview-container {
            margin: 20px 0;
            text-align: center;
        }

        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .care-plan-content code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
        }

        .care-plan-content pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 15px 0;
        }

        .care-plan-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .care-plan-content table th,
        .care-plan-content table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        .care-plan-content table th {
            background: #27ae60;
            color: white;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>🌿 Plant Analysis & Care System</h1>
        <p class="subtitle">Advanced plant identification, disease detection & personalized 7-day care planning</p>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="full">🔬 Full Analysis</button>
            <button class="mode-btn" data-mode="full-care">🔬 Full + 7-Day Care Plan</button>
            <button class="mode-btn" data-mode="species">🔍 Species Only</button>
            <button class="mode-btn" data-mode="disease">🩺 Disease Only</button>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📷</div>
            <div class="upload-text">Click or drag & drop an image here</div>
            <div class="upload-hint">Supports JPG, PNG, WEBP</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div id="previewContainer" class="preview-container hidden">
            <img id="previewImage" class="preview-image" alt="Preview">
            <br>
            <div id="actionButtons" style="margin-top: 20px;"></div>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p id="loadingText">Analyzing image...</p>
        </div>

        <div id="results" class="results hidden">
            <div id="resultsContainer"></div>
        </div>

        <div id="message" class="hidden"></div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const actionButtons = document.getElementById('actionButtons');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const results = document.getElementById('results');
        const resultsContainer = document.getElementById('resultsContainer');
        const message = document.getElementById('message');
        const modeButtons = document.querySelectorAll('.mode-btn');

        let selectedFile = null;
        let currentMode = 'full';

        modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                modeButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                updateActionButtons();
            });
        });

        function updateActionButtons() {
            if (!selectedFile) return;
            actionButtons.innerHTML = '';

            if (currentMode === 'full') {
                actionButtons.innerHTML = '<button class="btn" onclick="analyzeImage(\'full\', false)">🔬 Full Analysis</button>';
            } else if (currentMode === 'full-care') {
                actionButtons.innerHTML = '<button class="btn" onclick="analyzeImage(\'full\', true)">🔬 Analyze & Generate 7-Day Care Plan</button>';
            } else if (currentMode === 'species') {
                actionButtons.innerHTML = '<button class="btn" onclick="analyzeImage(\'species\', false)">🔍 Identify Species</button>';
            } else if (currentMode === 'disease') {
                actionButtons.innerHTML = '<button class="btn" onclick="analyzeImage(\'disease\', false)">🩺 Detect Disease</button>';
            }
        }

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                showMessage('Please select a valid image file', 'error');
                return;
            }

            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.classList.remove('hidden');
                results.classList.add('hidden');
                message.classList.add('hidden');
                updateActionButtons();
            };
            reader.readAsDataURL(file);
        }

        async function analyzeImage(mode, withCarePlan) {
            if (!selectedFile) return;

            loading.classList.remove('hidden');
            results.classList.add('hidden');
            message.classList.add('hidden');
            document.querySelectorAll('.btn').forEach(btn => btn.disabled = true);

            if (withCarePlan) {
                loadingText.textContent = 'Analyzing plant and generating personalized 7-day care plan... This may take 30-60 seconds.';
            } else {
                loadingText.textContent = 'Analyzing image...';
            }

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                let url;
                if (mode === 'full') {
                    url = `/api/analyze?generate_care_plan=${withCarePlan}&days=7`;
                } else if (mode === 'species') {
                    url = '/api/identify';
                } else if (mode === 'disease') {
                    url = '/api/detect-disease';
                }

                const response = await fetch(url, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (mode === 'full' && data.success) {
                    displayFullResults(data, withCarePlan);
                } else if (mode === 'species' && data.success) {
                    displaySpeciesOnlyResults(data);
                } else if (mode === 'disease' && data.success) {
                    displayDiseaseOnlyResults(data);
                } else {
                    showMessage(data.message || 'Analysis failed. Please try again.', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            } finally {
                loading.classList.add('hidden');
                document.querySelectorAll('.btn').forEach(btn => btn.disabled = false);
            }
        }

        function displayFullResults(data, withCarePlan) {
            resultsContainer.innerHTML = '';
            results.classList.remove('hidden');

            const grid = document.createElement('div');
            grid.className = 'results-grid';

            const speciesSection = document.createElement('div');
            speciesSection.innerHTML = '<div class="section-header"><span>🔍</span><span>Species Identification</span></div><div id="speciesResults"></div>';
            grid.appendChild(speciesSection);

            const diseaseSection = document.createElement('div');
            diseaseSection.innerHTML = '<div class="section-header"><span>🔬</span><span>Disease Detection</span></div><div id="diseaseResults"></div>';
            grid.appendChild(diseaseSection);

            resultsContainer.appendChild(grid);

            const speciesResults = document.getElementById('speciesResults');
            const diseaseResults = document.getElementById('diseaseResults');

            if (data.species_identification.success && data.species_identification.results.length > 0) {
                displaySpeciesResults(data.species_identification.results, speciesResults);
            } else {
                speciesResults.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">No species identified</div>';
            }

            if (data.disease_detection.success && data.disease_detection.predictions.length > 0) {
                displayDiseaseResults(data.disease_detection.predictions, diseaseResults, data.disease_detection.filter_message);
            } else {
                diseaseResults.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">No diseases detected</div>';
            }

            if (withCarePlan && data.care_plan) {
                if (data.care_plan.success) {
                    displayCarePlan(data.care_plan, resultsContainer);
                } else {
                    const carePlanSection = document.createElement('div');
                    carePlanSection.className = 'care-plan-section';
                    carePlanSection.innerHTML = `<div class="warning-message">${data.care_plan.error || 'Care plan could not be generated'}</div>`;
                    resultsContainer.appendChild(carePlanSection);
                }
            }
        }

        function displaySpeciesResults(plantsData, container) {
            container.innerHTML = '';
            plantsData.forEach((plant, index) => {
                if (index >= 3) return;
                const card = document.createElement('div');
                card.className = 'result-card';
                
                const commonNamesText = plant.common_names.length > 0 
                    ? plant.common_names.join(', ')
                    : 'No common names available';

                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <div style="font-size: 1.4em; color: #333; font-style: italic; font-weight: bold;">${plant.scientific_name}</div>
                        <div class="confidence">${plant.score}%</div>
                    </div>
                    <div style="margin-top: 10px;">
                        <div style="margin: 8px 0; color: #555;">
                            <span style="font-weight: bold; color: #27ae60;">Common Names:</span>
                            <span style="color: #666; font-style: italic;">${commonNamesText}</span>
                        </div>
                        <div style="margin: 8px 0; color: #555;">
                            <span style="font-weight: bold; color: #27ae60;">Family:</span> ${plant.family}
                        </div>
                        <div style="margin: 8px 0; color: #555;">
                            <span style="font-weight: bold; color: #27ae60;">Genus:</span> ${plant.genus}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function displayDiseaseResults(predictions, container, filterMessage) {
            container.innerHTML = '';
            
            if (filterMessage) {
                const msgDiv = document.createElement('div');
                if (filterMessage.includes('⚠️')) {
                    msgDiv.className = 'warning-message';
                } else if (filterMessage.includes('✓')) {
                    msgDiv.className = 'success';
                }
                msgDiv.style.marginBottom = '15px';
                msgDiv.innerHTML = filterMessage.replace(/\n/g, '<br>');
                container.appendChild(msgDiv);
            }
            
            predictions.forEach((prediction, index) => {
                if (index >= 3) return;
                const card = document.createElement('div');
                const isHealthy = prediction.is_healthy;
                
                card.className = `result-card disease-card ${isHealthy ? 'healthy' : 'warning'}`;

                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <div>
                            <div style="font-size: 1.3em; color: #333; font-weight: bold;">
                                ${isHealthy ? '✅' : '⚠️'} ${prediction.disease}
                            </div>
                            <div style="color: #666; font-size: 0.9em; margin-top: 5px;">
                                Plant: ${prediction.plant}
                            </div>
                        </div>
                        <div class="confidence">${prediction.confidence.toFixed(1)}%</div>
                    </div>
                    <div style="display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 0.9em; font-weight: bold; margin-top: 10px; background: ${isHealthy ? '#d4edda' : '#f8d7da'}; color: ${isHealthy ? '#155724' : '#721c24'};">
                        ${isHealthy ? 'Healthy Plant' : 'Disease Detected'}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function displayCarePlan(carePlan, container) {
            const carePlanSection = document.createElement('div');
            carePlanSection.className = 'care-plan-section';

            const html = `
                <div class="care-plan-header">
                    <h2>📋 ${carePlan.days}-Day Personalized Care Plan</h2>
                    <div class="care-plan-meta">
                        <span>🌱 ${carePlan.plant_name}</span>
                        <span>🔬 ${carePlan.scientific_name}</span>
                        <span>📊 Care Level: ${carePlan.care_level}</span>
                    </div>
                </div>
                <div class="care-plan-content" id="carePlanText"></div>
            `;

            carePlanSection.innerHTML = html;
            container.appendChild(carePlanSection);

            const carePlanTextDiv = document.getElementById('carePlanText');
            carePlanTextDiv.innerHTML = marked.parse(carePlan.care_plan_text);
        }

        function displaySpeciesOnlyResults(data) {
            resultsContainer.innerHTML = '';
            results.classList.remove('hidden');

            const section = document.createElement('div');
            section.innerHTML = '<div class="section-header"><span>🔍</span><span>Species Identification Results</span></div><div id="speciesResults"></div>';
            resultsContainer.appendChild(section);

            const speciesResults = document.getElementById('speciesResults');
            
            if (data.success && data.results.length > 0) {
                displaySpeciesResults(data.results, speciesResults);
            } else {
                speciesResults.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">No species identified</div>';
            }
        }

        function displayDiseaseOnlyResults(data) {
            resultsContainer.innerHTML = '';
            results.classList.remove('hidden');

            const section = document.createElement('div');
            section.innerHTML = '<div class="section-header"><span>🩺</span><span>Disease Detection Results</span></div><div id="diseaseResults"></div>';
            resultsContainer.appendChild(section);

            const diseaseResults = document.getElementById('diseaseResults');
            
            if (data.success && data.predictions.length > 0) {
                displayDiseaseResults(data.predictions, diseaseResults, data.filter_message);
            } else {
                diseaseResults.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">No diseases detected</div>';
            }
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = type;
            message.classList.remove('hidden');
        }
    </script>
</body>
</html>
