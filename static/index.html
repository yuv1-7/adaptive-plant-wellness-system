<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Species Identifier — Auth Demo</title>
  <style>
    /* (styles same as provided earlier) */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .container { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 900px; width: 100%; padding: 24px 40px 40px; }
    header { display:flex; justify-content:space-between; align-items:center; gap: 16px; margin-bottom: 10px; }
    h1 { color:#333; text-align:left; font-size:2em; }
    .auth-ui { display:flex; gap:8px; align-items:center; }
    .auth-ui input { padding:8px; border-radius:8px; border:1px solid #ddd; }
    .auth-ui button { padding:8px 12px; border-radius:8px; border:none; background:#667eea; color:white; cursor:pointer; }
    .status { font-size:0.9rem; color:#444; margin-top:8px; }
    .subtitle { text-align:center; color:#666; margin-bottom:18px; font-size:1.05em; }
    .upload-area { border:3px dashed #667eea; border-radius:15px; padding:36px; text-align:center; cursor:pointer; transition:all 0.3s ease; background:#f8f9ff; margin-bottom:20px; }
    .upload-area:hover { border-color:#764ba2; background:#f0f1ff; }
    .upload-area.drag-over { border-color:#764ba2; background:#e8e9ff; transform:scale(1.02); }
    .upload-icon { font-size:3.2em; margin-bottom:10px; color:#667eea; }
    .upload-text { color:#555; font-size:1.1em; margin-bottom:6px; }
    .upload-hint { color:#999; font-size:0.9em; }
    #fileInput { display:none; }
    .btn { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:white; border:none; padding:12px 28px; border-radius:24px; font-size:1em; cursor:pointer; transition:transform .2s,box-shadow .2s; display:inline-block; margin-top:10px; }
    .btn:hover { transform:translateY(-2px); box-shadow:0 10px 20px rgba(102,126,234,.4); }
    .btn:disabled { opacity:.6; cursor:not-allowed; transform:none; }
    .preview-container { margin:16px 0; text-align:center; }
    .preview-image { max-width:100%; max-height:400px; border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,.2); }
    .loading { text-align:center; padding:20px; }
    .spinner { border:4px solid #f3f3f3; border-top:4px solid #667eea; border-radius:50%; width:40px; height:40px; animation:spin 1s linear infinite; margin:0 auto 12px; }
    @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
    .results { margin-top:20px; }
    .result-card { background:#f8f9ff; border-radius:12px; padding:16px; margin-bottom:12px; border-left:5px solid #667eea; }
    .result-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .scientific-name { font-size:1.2em; color:#333; font-style:italic; font-weight:bold; }
    .confidence { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:white; padding:6px 12px; border-radius:20px; font-weight:bold; }
    .info-item { margin:6px 0; color:#555; }
    .info-label { font-weight:bold; color:#667eea; }
    .common-names { color:#666; font-style:italic; }
    .error { background:#ffe6e6; border-left:5px solid #ff4444; padding:12px; border-radius:10px; color:#cc0000; margin-top:12px; }
    .success { background:#e6ffe6; border-left:5px solid #44ff44; padding:12px; border-radius:10px; color:#006600; margin-top:12px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>🌿 Plant Species Identifier</h1>
        <div class="subtitle">Upload an image to identify plant species using AI</div>
      </div>

      <!-- Auth UI -->
      <div>
        <div class="auth-ui" id="auth-ui">
          <input id="email" placeholder="email" />
          <input id="password" type="password" placeholder="password" />
          <button id="signup">Sign up</button>
          <button id="login">Log in</button>
          <button id="googleSignIn">Google</button>
          <button id="logout" class="hidden">Logout</button>
        </div>
        <div class="status" id="status">Not signed in</div>
      </div>
    </header>

    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">📷</div>
      <div class="upload-text">Click or drag & drop an image here</div>
      <div class="upload-hint">Supports JPG, PNG, WEBP</div>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div id="previewContainer" class="preview-container hidden">
      <img id="previewImage" class="preview-image" alt="Preview">
      <br>
      <button class="btn" id="identifyBtn">Identify Plant</button>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Analyzing image and identifying plant species...</p>
    </div>

    <div id="results" class="results hidden"></div>
    <div id="message" class="hidden"></div>
  </div>

  <!-- Firebase v10 modular SDK -->
  <script type="module">
    // ---------- CONFIG ----------
    // Replace with your Firebase project's config (get from Firebase Console -> Project settings -> SDK setup)
    const firebaseConfig = {
      apiKey: "AIzaSyCXvmc46zXLqhZAYkyqZna7Lu8OwtVNxqM",
      authDomain: "adaptive-plant-wellness-system.firebaseapp.com",
      projectId: "adaptive-plant-wellness-system",
      storageBucket: "adaptive-plant-wellness-system.firebasestorage.app",
      messagingSenderId: "656958051439",
      appId: "1:656958051439:web:fe22efb0fb1b0b8d64a99a",
      measurementId: "G-XS62VBM7X5"

      
    };

    // If you want to require users to be signed in before calling /api/identify set to true
    const requireLogin = true;

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, signInWithEmailAndPassword,
      createUserWithEmailAndPassword, signOut, GoogleAuthProvider, signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // ---------- UI elements ----------
    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');
    const status = document.getElementById('status');
    const signupBtn = document.getElementById('signup');
    const loginBtn = document.getElementById('login');
    const googleBtn = document.getElementById('googleSignIn');
    const logoutBtn = document.getElementById('logout');

    // Plant UI elements
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const previewImage = document.getElementById('previewImage');
    const identifyBtn = document.getElementById('identifyBtn');
    const loading = document.getElementById('loading');
    const results = document.getElementById('results');
    const message = document.getElementById('message');

    let selectedFile = null;
    let currentIdToken = null; // will hold ID token when signed in

    // ---------- Auth button handlers ----------
    signupBtn.onclick = async () => {
      try {
        await createUserWithEmailAndPassword(auth, emailInput.value, passInput.value);
      } catch (err) { status.innerText = err.message; }
    };

    loginBtn.onclick = async () => {
      try {
        await signInWithEmailAndPassword(auth, emailInput.value, passInput.value);
      } catch (err) { status.innerText = err.message; }
    };

    googleBtn.onclick = async () => {
      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
      } catch (err) { status.innerText = err.message; }
    };

    logoutBtn.onclick = async () => {
      await signOut(auth);
    };

    // ---------- Auth state ----------
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // get fresh ID token
        currentIdToken = await user.getIdToken(true);
        status.innerText = `Signed in as ${user.email || '(no email)'}`;
        logoutBtn.classList.remove('hidden');
        signupBtn.classList.add('hidden');
        loginBtn.classList.add('hidden');
        googleBtn.classList.add('hidden');
        emailInput.classList.add('hidden');
        passInput.classList.add('hidden');
      } else {
        currentIdToken = null;
        status.innerText = 'Not signed in';
        logoutBtn.classList.add('hidden');
        signupBtn.classList.remove('hidden');
        loginBtn.classList.remove('hidden');
        googleBtn.classList.remove('hidden');
        emailInput.classList.remove('hidden');
        passInput.classList.remove('hidden');
      }
      refreshIdentifyButtonState();
    });

    setInterval(async () => {
      const user = auth.currentUser;
      if (user) {
        currentIdToken = await user.getIdToken(true).catch(()=>null);
      }
    }, 50 * 60 * 1000);

    // ---------- Upload handlers ----------
    uploadArea.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
    uploadArea.addEventListener('drop', (e) => { e.preventDefault(); uploadArea.classList.remove('drag-over'); handleFile(e.dataTransfer.files[0]); });

    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        showMessage('Please select a valid image file', 'error');
        return;
      }
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        previewImage.src = e.target.result;
        previewContainer.classList.remove('hidden');
        results.classList.add('hidden');
        message.classList.add('hidden');
        refreshIdentifyButtonState();
      };
      reader.readAsDataURL(file);
    }

    function refreshIdentifyButtonState() {
      if (!selectedFile) { identifyBtn.disabled = true; return; }
      if (requireLogin) { identifyBtn.disabled = !currentIdToken; }
      else { identifyBtn.disabled = false; }
    }

    identifyBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      loading.classList.remove('hidden');
      results.classList.add('hidden');
      message.classList.add('hidden');
      identifyBtn.disabled = true;

      const formData = new FormData();
      formData.append('file', selectedFile);

      const headers = {};
      if (currentIdToken) { headers['Authorization'] = 'Bearer ' + currentIdToken; }

      try {
        const response = await fetch('/api/identify', {
          method: 'POST',
          headers,
          body: formData
        });

        if (response.status === 401) {
          showMessage('Unauthorized. Please sign in.', 'error');
          return;
        }

        const contentType = response.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          const data = await response.json();
          if (data.success && data.results && data.results.length > 0) {
            displayResults(data.results);
          } else {
            showMessage(data.message || 'No plants identified in the image', 'error');
          }
        } else {
          const text = await response.text();
          showMessage(text, 'error');
        }
      } catch (error) {
        showMessage('Error: ' + error.message, 'error');
      } finally {
        loading.classList.add('hidden');
        identifyBtn.disabled = false;
      }
    });

    function displayResults(plantsData) {
      results.innerHTML = '';
      results.classList.remove('hidden');

      plantsData.forEach((plant) => {
        const card = document.createElement('div');
        card.className = 'result-card';

        const commonNamesText = (plant.common_names && plant.common_names.length > 0)
          ? plant.common_names.join(', ')
          : 'No common names available';

        card.innerHTML = `
          <div class="result-header">
            <div class="scientific-name">${plant.scientific_name}</div>
            <div class="confidence">${plant.score}% match</div>
          </div>
          <div class="result-info">
            <div class="info-item"><span class="info-label">Common Names:</span> <span class="common-names">${commonNamesText}</span></div>
            <div class="info-item"><span class="info-label">Family:</span> ${plant.family || 'N/A'}</div>
            <div class="info-item"><span class="info-label">Genus:</span> ${plant.genus || 'N/A'}</div>
          </div>
        `;
        results.appendChild(card);
      });
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
      message.classList.remove('hidden');
    }

    refreshIdentifyButtonState();
  </script>
</body>
</html>
